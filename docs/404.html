  <!-- Theme: set data-theme before first paint (no flash).
       Priority: 1) ?theme= query param — reach ANY theme incl. hidden ones,
       e.g. ?theme=dark or ?theme=light (non-destructive: doesn't overwrite the
       saved choice), 2) the saved toggle choice in localStorage, 3) the OS colour
       scheme mapped to the current GTA family (dark -> gta, light -> gta-light). -->
  <script>
    (function () {
      try {
        var VALID = { light: 1, dark: 1, gta: 1, 'gta-light': 1 };
        // theme-color for the mobile browser chrome, per theme.
        var CHROME = { light: '#f7f3ec', dark: '#16130e', gta: '#0a0612', 'gta-light': '#f6f1fb' };
        var t = null;
        // 1) URL query param wins — the way to reach hidden themes.
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          if (VALID[q]) t = q;
        } catch (e) {}
        // 2) then the user's saved toggle choice.
        if (!t) {
          var s = localStorage.getItem('theme');
          if (VALID[s]) t = s;
        }
        // 3) then the OS colour scheme, mapped to the current (GTA) theme family.
        if (!t) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gta' : 'gta-light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && CHROME[t]) meta.setAttribute('content', CHROME[t]);
      } catch (e) {}
    })();
  </script>
