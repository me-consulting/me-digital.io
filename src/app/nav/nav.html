<header class="nav" [class.nav--scrolled]="false">
  <div class="container nav__inner">
    <a class="nav__brand" routerLink="/" (click)="close()" aria-label="Zur Startseite">
      <span class="nav__mark" aria-hidden="true">◆</span>
      <span class="nav__brand-text">{{ brand }}</span>
    </a>

    <nav class="nav__links" [class.nav__links--open]="open()" aria-label="Hauptnavigation">
      @for (l of links; track l.href) {
        <a
          class="nav__link"
          [class.is-active]="false"
          routerLink="/{{ l.href }}"
          routerLinkActive="is-active"
          (click)="close()"
          >{{ l.label }}</a
        >
      }
      <a class="btn btn--primary nav__cta" routerLink="/contact" (click)="close()"
        >Kontakt aufnehmen</a
      >
    </nav>

    <button
      class="nav__toggle"
      [class.is-dark]="dark()"
      (click)="toggleTheme()"
      [attr.aria-label]="dark() ? 'Zum hellen Design wechseln' : 'Zum dunklen Design wechseln'"
      [attr.aria-pressed]="dark()"
    >
      <svg
        class="nav__toggle-icon nav__toggle-icon--moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
      <svg
        class="nav__toggle-icon nav__toggle-icon--sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
        />
      </svg>
    </button>

    <button
      class="nav__burger"
      [class.is-open]="open()"
      [attr.aria-expanded]="open()"
      aria-label="Menü umschalten"
      (click)="toggle()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
